name: E2E Tests

on:
  workflow_run:
    workflows: ["Deploy to Fly.io"]
    types: [completed]

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Przypięte, nie ubuntu-latest: 23.11.2026 runner przeszedł na Ubuntu
    # 26.04, a `playwright install chromium` odmawia na nim pracy
    # ("does not support chromium on ubuntu26.04-x64") — również w najnowszej
    # wersji 1.59.1, którą mamy w locku. Zdejmij przypięcie, gdy Playwright
    # dorzuci buildy przeglądarek dla 26.04.
    runs-on: ubuntu-24.04
    env:
      TEST_BASE_URL: https://logoped.fly.dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=public --project=integration
