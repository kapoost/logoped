name: Uptime

# Pyta produkcję co 15 minut, czy widzi Supabase. Gdy nie widzi — job pada,
# a GitHub wysyła maila właścicielowi repo.
#
# Po co: 23.11.2026 projekt Supabase zniknął z DNS i nikt nie mógł się
# zalogować. Health check Fly świecił na zielono (bo sprawdzał tylko, czy
# Next odpowiada), aplikacja zasypiała między zapytaniami, więc w logach nie
# było nawet błędu. Awaria wyszła dopiero wtedy, gdy ktoś ręcznie zajrzał.
#
# Uwaga na dwa ograniczenia GitHuba, z którymi trzeba żyć albo przejść na
# płatny monitoring zewnętrzny:
#   · harmonogram bywa opóźniony o kilkanaście minut przy obciążeniu,
#   · workflow na schedule wyłącza się po 60 dniach bez commita w repo
#     (GitHub przysyła wtedy maila z prośbą o włączenie).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Czy produkcja widzi Supabase
        run: |
          # Dwie próby — pierwsza budzi maszynę (auto_stop_machines), więc
          # potrafi trafić w zimny start i timeout. Alarm ma iść przy
          # prawdziwej awarii, nie przy budzeniu kontenera.
          for i in 1 2; do
            kod=$(curl -s -o /tmp/zdrowie.json -w '%{http_code}' --max-time 25 \
                  'https://logoped.fly.dev/api/health?deep=1' || echo 000)
            if [ "$kod" = "200" ]; then
              echo "Produkcja zdrowa."
              cat /tmp/zdrowie.json
              exit 0
            fi
            echo "próba $i: HTTP $kod"
            cat /tmp/zdrowie.json 2>/dev/null || true
            echo
            [ "$i" = "1" ] && sleep 20
          done

          echo
          echo "::error::LogoPed nie dociera do Supabase — logowanie jest niedostępne dla wszystkich."
          exit 1
